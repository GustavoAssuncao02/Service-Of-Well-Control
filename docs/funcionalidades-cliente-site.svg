<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Funcionalidades do site Service Of Well Control</title>
  <desc id="desc">Infografico simples mostrando as principais funcionalidades do site para apresentacao comercial.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f2d5c" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#1f5ea8"/>
    </marker>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2d5c"/>
      <stop offset="1" stop-color="#1f6feb"/>
    </linearGradient>
  </defs>

  <style>
    .bg { fill: #f3f7fc; }
    .title { fill: #0f172a; font: 800 46px Arial, sans-serif; }
    .subtitle { fill: #53627c; font: 400 24px Arial, sans-serif; }
    .brand { fill: #f97316; font: 800 18px Arial, sans-serif; letter-spacing: 3px; }
    .card { fill: #ffffff; stroke: #d8e4f5; stroke-width: 2; rx: 18; filter: url(#shadow); }
    .card-title { fill: #0f2d5c; font: 800 24px Arial, sans-serif; }
    .item { fill: #334155; font: 500 20px Arial, sans-serif; }
    .num-bg { fill: url(#hero); }
    .num { fill: #ffffff; font: 800 24px Arial, sans-serif; }
    .dot { fill: #f97316; }
    .arrow-line { stroke: #1f5ea8; stroke-width: 4; stroke-linecap: round; marker-end: url(#arrow); }
    .result { fill: #0f2d5c; rx: 24; filter: url(#shadow); }
    .result-title { fill: #ffffff; font: 800 28px Arial, sans-serif; }
    .result-text { fill: #dbeafe; font: 600 22px Arial, sans-serif; }
  </style>

  <rect class="bg" x="0" y="0" width="1600" height="900"/>

  <text class="brand" x="80" y="76">SERVICE OF WELL CONTROL</text>
  <text class="title" x="80" y="132">Funcionalidades do site em uma visao simples</text>
  <text class="subtitle" x="80" y="174">Do cadastro do aluno aos relatorios, tudo centralizado para reduzir planilhas, erros e retrabalho.</text>

  <g transform="translate(70 235)">
    <rect class="card" x="0" y="0" width="240" height="350"/>
    <circle class="num-bg" cx="42" cy="48" r="25"/>
    <text class="num" x="34" y="57">1</text>
    <text class="card-title" x="28" y="102">Entrada do aluno</text>
    <circle class="dot" cx="32" cy="165" r="5"/><text class="item" x="52" y="172">Cadastro do aluno</text>
    <circle class="dot" cx="32" cy="235" r="5"/><text class="item" x="52" y="242">Avaliacao de</text>
    <text class="item" x="52" y="272">reacao online</text>
  </g>

  <line class="arrow-line" x1="322" y1="410" x2="360" y2="410"/>

  <g transform="translate(380 235)">
    <rect class="card" x="0" y="0" width="240" height="350"/>
    <circle class="num-bg" cx="42" cy="48" r="25"/>
    <text class="num" x="34" y="57">2</text>
    <text class="card-title" x="28" y="102">Gestao interna</text>
    <circle class="dot" cx="32" cy="145" r="5"/><text class="item" x="52" y="152">Alunos e empresas</text>
    <circle class="dot" cx="32" cy="195" r="5"/><text class="item" x="52" y="202">Instrutores</text>
    <circle class="dot" cx="32" cy="245" r="5"/><text class="item" x="52" y="252">Cursos e turmas</text>
    <circle class="dot" cx="32" cy="295" r="5"/><text class="item" x="52" y="302">Documentos</text>
  </g>

  <line class="arrow-line" x1="632" y1="410" x2="670" y2="410"/>

  <g transform="translate(690 235)">
    <rect class="card" x="0" y="0" width="240" height="350"/>
    <circle class="num-bg" cx="42" cy="48" r="25"/>
    <text class="num" x="34" y="57">3</text>
    <text class="card-title" x="28" y="102">Acompanhamento</text>
    <circle class="dot" cx="32" cy="145" r="5"/><text class="item" x="52" y="152">Calendario</text>
    <circle class="dot" cx="32" cy="195" r="5"/><text class="item" x="52" y="202">Dashboard</text>
    <circle class="dot" cx="32" cy="245" r="5"/><text class="item" x="52" y="252">Online/presencial</text>
    <circle class="dot" cx="32" cy="295" r="5"/><text class="item" x="52" y="302">Avaliacoes</text>
  </g>

  <line class="arrow-line" x1="942" y1="410" x2="980" y2="410"/>

  <g transform="translate(1000 235)">
    <rect class="card" x="0" y="0" width="240" height="350"/>
    <circle class="num-bg" cx="42" cy="48" r="25"/>
    <text class="num" x="34" y="57">4</text>
    <text class="card-title" x="28" y="102">Relatorios</text>
    <circle class="dot" cx="32" cy="145" r="5"/><text class="item" x="52" y="152">Turmas</text>
    <circle class="dot" cx="32" cy="195" r="5"/><text class="item" x="52" y="202">Alunos</text>
    <circle class="dot" cx="32" cy="245" r="5"/><text class="item" x="52" y="252">Avaliacoes</text>
    <circle class="dot" cx="32" cy="295" r="5"/><text class="item" x="52" y="302">PDF, PNG e Excel</text>
  </g>

  <line class="arrow-line" x1="1252" y1="410" x2="1290" y2="410"/>

  <g transform="translate(1310 235)">
    <rect class="card" x="0" y="0" width="240" height="350"/>
    <circle class="num-bg" cx="42" cy="48" r="25"/>
    <text class="num" x="34" y="57">5</text>
    <text class="card-title" x="28" y="102">Administracao</text>
    <circle class="dot" cx="32" cy="145" r="5"/><text class="item" x="52" y="152">Usuarios</text>
    <circle class="dot" cx="32" cy="195" r="5"/><text class="item" x="52" y="202">Solicitacoes</text>
    <circle class="dot" cx="32" cy="245" r="5"/><text class="item" x="52" y="252">Perfil e senha</text>
  </g>

  <rect class="result" x="110" y="680" width="1380" height="130"/>
  <text class="result-title" x="160" y="730">Resultado para a empresa</text>
  <text class="result-text" x="160" y="772">Informacoes centralizadas | menos planilhas | menos erros | mais organizacao | experiencia mais profissional para o cliente</text>
</svg>
